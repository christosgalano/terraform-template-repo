version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the version comment.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Needs a root module with a .terraform.lock.hcl, i.e. once you add a provider.
  - package-ecosystem: terraform
    directories:
      - "/terraform/environments/*"
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns: ["*"]
