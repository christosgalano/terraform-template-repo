# Manual teardown of one environment. Plans the destroy, then waits for approval
# on the environment before applying it. Typing the environment name again guards
# against picking the wrong one.
name: Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options:
          - development
          - staging
          - production
        required: true
        description: Environment to destroy.
      confirm:
        type: string
        required: true
        description: Type the environment name again to confirm.

permissions: {}

jobs:
  confirm:
    name: Confirm
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${CONFIRM}" != "${ENVIRONMENT}" ]; then
            echo "::error::'${CONFIRM}' does not match '${ENVIRONMENT}'."
            exit 1
          fi

  destroy:
    name: Destroy (${{ inputs.environment }})
    needs: confirm
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: ${{ inputs.environment }}
      destroy: true
    secrets: inherit
